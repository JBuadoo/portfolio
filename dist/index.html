<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Joseph K. Buadoo | Interactive Designer & Creative Developer</title>
    <meta name="description" content="Joseph K. Buadoo – Interactive Designer, UI/UX Designer & Creative Developer. Explore an interactive pixel-art study where every book on the shelf holds a part of my work." />
    <meta name="author" content="Joseph K. Buadoo" />
    <meta name="theme-color" content="#120a1f" />
    <meta property="og:title" content="Joseph K. Buadoo | Interactive Designer & Creative Developer" />

    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" href="/fonts/jbpixelify-400.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/jbpixel.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/jbpixel-bold.woff" as="font" type="font/woff" crossorigin />
    <style>
      /* Declared here so every url() resolves relative to the page (works for any base path). */
      @font-face {
        font-family: "JB Pixel";
        src: url("/fonts/jbpixel.woff") format("woff"), url("/fonts/jbpixel.ttf") format("truetype");
        font-display: swap;
      }
      @font-face {
        font-family: "JB Pixel";
        font-weight: 700;
        src: url("/fonts/jbpixel-bold.woff") format("woff"), url("/fonts/jbpixel-bold.ttf") format("truetype");
        font-display: swap;
      }
      /* JB Pixelify: Pixelify Sans (SIL OFL) with clearer c / C / 5 */
      @font-face {
        font-family: "JB Pixelify";
        font-weight: 400;
        src: url("/fonts/jbpixelify-400.woff") format("woff");
        font-display: swap;
      }
      /* JB Pixelify: Pixelify Sans (SIL OFL) with clearer c / C / 5 */
      @font-face {
        font-family: "JB Pixelify";
        font-weight: 500;
        src: url("/fonts/jbpixelify-500.woff") format("woff");
        font-display: swap;
      }
      /* JB Pixelify: Pixelify Sans (SIL OFL) with clearer c / C / 5 */
      @font-face {
        font-family: "JB Pixelify";
        font-weight: 600;
        src: url("/fonts/jbpixelify-600.woff") format("woff");
        font-display: swap;
      }
      /* JB Pixelify: Pixelify Sans (SIL OFL) with clearer c / C / 5 */
      @font-face {
        font-family: "JB Pixelify";
        font-weight: 700;
        src: url("/fonts/jbpixelify-700.woff") format("woff");
        font-display: swap;
      }
      :root {
        --img-page-l: url("/assets/ui/page-left.png");
        --img-page-r: url("/assets/ui/page-right.png");
        --img-page-s: url("/assets/ui/page-single.png");
        --img-parchment: url("/assets/ui/parchment.png");
        --img-ui9: url("/assets/ui/ui9.png");
        --img-ui9-active: url("/assets/ui/ui9-active.png");
        --img-ui9-paper: url("/assets/ui/ui9-paper.png");
        --img-wall-tile: url("/assets/scene/wall-tile.png");
        --img-wall-tile-day: url("/assets/scene/wall-tile-day.png");
        --img-wall-tile-night: url("/assets/scene/wall-tile-night.png");
      }
      html, body { background: #120a1f; }
    </style>

    <noscript>
      <p style="color:#efe6ff;font-family:sans-serif;padding:24px">
        This portfolio is an interactive experience and needs JavaScript. Contact: jrkwekub@gmail.com

    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
